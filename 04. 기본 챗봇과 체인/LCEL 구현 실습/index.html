<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>교대 근무 인수인계 요약 챗봇</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: #ffffff;              /* 흰색 */
      color: #222;
      height: 100vh;
      display: flex;
      justify-content: center;
    }

    .chat-wrap {
      width: 100%;
      max-width: 720px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border-left: 1px solid #d8ecfa;
      border-right: 1px solid #d8ecfa;
    }

    /* 헤더: 파란색 */
    header {
      background: #1e6fd9;              /* 파란색 */
      color: #ffffff;
      padding: 16px 20px;
    }
    header h1 { font-size: 18px; }
    header p { font-size: 13px; margin-top: 4px; opacity: 0.85; }

    /* 대화 영역: 하늘색 배경 */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #e6f3fc;              /* 하늘색 */
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .row { display: flex; }
    .row.bot    { justify-content: flex-start; }
    .row.user   { justify-content: flex-end; }

    .message {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.55;
      white-space: pre-line;            /* 3줄 요약 줄바꿈 유지 */
      word-break: break-word;
    }

    /* 봇 말풍선: 하늘색 */
    .bot .message {
      background: #bae6fd;              /* 하늘색 */
      border-top-left-radius: 4px;
    }

    /* 사용자 말풍선: 파란색 */
    .user .message {
      background: #1e6fd9;              /* 파란색 */
      color: #ffffff;
      border-top-right-radius: 4px;
    }

    .message.error { background: #ffe1e1; color: #b00020; }

    /* 입력 영역 */
    footer {
      display: flex;
      gap: 10px;
      padding: 14px 16px;
      border-top: 1px solid #d8ecfa;
      background: #ffffff;              /* 흰색 */
    }

    #input {
      flex: 1;
      height: 46px;
      padding: 12px 14px;
      border: 1px solid #bae6fd;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      resize: none;
      outline: none;
    }
    #input:focus { border-color: #1e6fd9; }

    #send {
      width: 78px;
      border: none;
      border-radius: 10px;
      background: #1e6fd9;              /* 파란색 */
      color: #ffffff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    #send:hover { background: #185cb8; }
    #send:disabled { background: #a9c8e8; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="chat-wrap">
    <header>
      <h1>교대 근무 인수인계 요약 챗봇</h1>
      <p>인수인계 내용을 입력하면 완료 / 진행중 / 특이사항 3줄로 요약합니다.</p>
    </header>
    <div id="chat"></div>
    <footer>
      <textarea id="input" placeholder="교대 근무 인수인계 내용을 입력하세요 (Enter: 전송, Shift+Enter: 줄바꿈)"></textarea>
      <button id="send">전송</button>
    </footer>
  </div>

  <script>
    const chatEl = document.getElementById("chat");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const base = location.pathname.endsWith("/") ? location.href : location.href + "/";
    const apiUrl = new URL("chat", base).toString();
    let waiting = false;

    function addMessage(text, role) {
      const row = document.createElement("div");
      row.className = "row " + role;
      const bubble = document.createElement("div");
      bubble.className = "message";
      bubble.textContent = text;
      row.appendChild(bubble);
      chatEl.appendChild(row);
      chatEl.scrollTop = chatEl.scrollHeight;
      return bubble;
    }

    addMessage("교대 근무 인수인계 내용을 입력하시면 완료 / 진행중 / 특이사항 3줄로 요약해 드립니다.", "bot");

    async function send() {
      const text = inputEl.value.trim();
      if (!text || waiting) return;

      addMessage(text, "user");
      inputEl.value = "";

      waiting = true;
      sendBtn.disabled = true;
      const pending = addMessage("입력 중...", "bot");

      try {
        const res = await fetch(apiUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: text }),
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        pending.textContent = data.answer || "(빈 응답입니다)";
      } catch (e) {
        pending.textContent = "오류가 발생했습니다: " + e.message;
        pending.classList.add("error");
      } finally {
        waiting = false;
        sendBtn.disabled = false;
        inputEl.focus();
        chatEl.scrollTop = chatEl.scrollHeight;
      }
    }

    sendBtn.addEventListener("click", send);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
    inputEl.focus();
  </script>
</body>
</html>
